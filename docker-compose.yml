version: '3.8'

services:
  db:
    image: postgres:16
    container_name: sagunto_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sagunto_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sagunto_api_container
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=sagunto_db;User Id=postgres;Password=password;
    ports:
      - "7010:8080"

volumes:
  postgres_data: